<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 282" width="960" height="282" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Three lines, sent one at a time and sent as one batch</title>
  <desc id="dsc">Sent one at a time, each line's synthesis only starts once the previous turn has ended, so the whole of it — about 1.2 seconds — falls between the lines as silence. Sent as one batch, all three syntheses are in flight from the start and the gap between lines drops to about 0.3 seconds.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .synth { fill:#cbdadd; stroke:#a9c3c8 }
    .play  { fill:#1a6873 }
    .inbar { fill:#ffffff; font-size:9.5px }
    .axis  { stroke:#b8b4ac; fill:none }
    .guide { stroke:#c3bfb7; fill:none; stroke-dasharray:3 3 }
    .brk   { stroke:#8c8b86; fill:none }
    text   { font-family:Inter,"Helvetica Neue",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12px }
    .s     { font-size:10.5px; fill:#6e7781 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117}
      .synth{fill:#23383e;stroke:#3a575e}
      .play{fill:#5aa9b5} .inbar{fill:#0d1117}
      .axis{stroke:#484f58} .guide{stroke:#3d444d} .brk{stroke:#6e7781}
      text{fill:#e6edf3} .s{fill:#8b949e}
    }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="282" rx="12"/>

  <text class="s" x="24" y="30">the same three lines, sent two ways</text>
  <rect class="synth" x="706" y="22" width="18" height="8" rx="2"/>
  <text class="s" x="732" y="30">synthesis</text>
  <rect class="play" x="800" y="19" width="18" height="12" rx="2"/>
  <text class="s" x="826" y="30">voice</text>

  <!-- one at a time -->
  <rect class="synth" x="168"   y="52" width="74.4" height="7" rx="2"/>
  <rect class="synth" x="397.4" y="61" width="74.4" height="7" rx="2"/>
  <rect class="synth" x="626.8" y="70" width="74.4" height="7" rx="2"/>

  <rect class="play" x="242.4" y="84" width="155" height="26" rx="3"/>
  <text class="inbar" x="319.9" y="101" text-anchor="middle">line 1</text>
  <rect class="play" x="471.8" y="84" width="155" height="26" rx="3"/>
  <text class="inbar" x="549.3" y="101" text-anchor="middle">line 2</text>
  <rect class="play" x="701.2" y="84" width="155" height="26" rx="3"/>
  <text class="inbar" x="778.7" y="101" text-anchor="middle">line 3</text>

  <text class="h" x="150" y="93"  text-anchor="end">one line at a time</text>
  <text class="s" x="150" y="108" text-anchor="end">each waits for the last</text>

  <path class="brk" d="M397.4,116 V124 M471.8,116 V124 M397.4,120 H471.8"/>
  <text class="s" x="434.6" y="137" text-anchor="middle">1.2 s</text>
  <path class="brk" d="M626.8,116 V124 M701.2,116 V124 M626.8,120 H701.2"/>
  <text class="s" x="664" y="137" text-anchor="middle">1.2 s</text>

  <!-- one batch -->
  <rect class="synth" x="168" y="140" width="74.4" height="7" rx="2"/>
  <rect class="synth" x="168" y="149" width="74.4" height="7" rx="2"/>
  <rect class="synth" x="168" y="158" width="74.4" height="7" rx="2"/>

  <rect class="play" x="242.4" y="172" width="155" height="26" rx="3"/>
  <text class="inbar" x="319.9" y="189" text-anchor="middle">line 1</text>
  <rect class="play" x="416"   y="172" width="155" height="26" rx="3"/>
  <text class="inbar" x="493.5" y="189" text-anchor="middle">line 2</text>
  <rect class="play" x="589.6" y="172" width="155" height="26" rx="3"/>
  <text class="inbar" x="667.1" y="189" text-anchor="middle">line 3</text>

  <text class="h" x="150" y="181" text-anchor="end">one batch</text>
  <text class="s" x="150" y="196" text-anchor="end">lines travel together</text>

  <path class="brk" d="M397.4,204 V212 M416,204 V212 M397.4,208 H416"/>
  <text class="s" x="406.7" y="225" text-anchor="middle">0.3 s</text>
  <path class="brk" d="M571,204 V212 M589.6,204 V212 M571,208 H589.6"/>
  <text class="s" x="580.3" y="225" text-anchor="middle">0.3 s</text>

  <path class="guide" d="M856.2,110 V244"/>
  <path class="guide" d="M744.6,198 V244"/>

  <path class="axis" d="M168,250 H912 M168,250 v4 M230,250 v4 M292,250 v4 M354,250 v4 M416,250 v4 M478,250 v4 M540,250 v4 M602,250 v4 M664,250 v4 M726,250 v4 M788,250 v4 M850,250 v4 M912,250 v4"/>
  <text class="s" x="168" y="268" text-anchor="middle">0</text>
  <text class="s" x="292" y="268" text-anchor="middle">2</text>
  <text class="s" x="416" y="268" text-anchor="middle">4</text>
  <text class="s" x="540" y="268" text-anchor="middle">6</text>
  <text class="s" x="664" y="268" text-anchor="middle">8</text>
  <text class="s" x="788" y="268" text-anchor="middle">10</text>
  <text class="s" x="912" y="268" text-anchor="middle">12 s</text>
</svg>
