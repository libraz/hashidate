<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What crosses the boundary</title>
  <desc id="dsc">On your side of the line: the language model and its SDK, the persona, the prompt and the memory, the script, and where the words come from. What crosses is one turn — the words, a performance, and the shot. On hashidate's side: a face and a movement, lipsync timed to the audio itself, the camera, the set and the slides, and the character rendered for OBS.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#1a6873 }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .ln    { fill:none; stroke:#1a6873; stroke-width:1.4 }
    .ah    { fill:#1a6873 }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#1a6873 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#6fbcc7}
      .seam{stroke:#484f58} .ln{stroke:#6fbcc7} .ah{fill:#6fbcc7} .mono{fill:#6fbcc7}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="340" rx="12"/>

  <path class="seam" d="M480,44 V300"/>
  <text class="lbl" x="480" y="36" text-anchor="middle">the boundary</text>

  <rect class="grp" x="24" y="60" width="376" height="230" rx="10"/>
  <text class="lbl" x="40" y="84">outside — yours</text>
  <rect class="chip" x="40" y="96"  width="344" height="36" rx="6"/>
  <text class="h" x="56" y="119">the model, and whichever SDK calls it</text>
  <rect class="chip" x="40" y="140" width="344" height="36" rx="6"/>
  <text class="h" x="56" y="163">the persona, the prompt, the memory</text>
  <rect class="chip" x="40" y="184" width="344" height="36" rx="6"/>
  <text class="h" x="56" y="207">the script — what to say, and in what order</text>
  <rect class="chip" x="40" y="228" width="344" height="36" rx="6"/>
  <text class="h" x="56" y="251">where the words come from — chat, ASR</text>

  <rect class="grp" x="560" y="60" width="376" height="230" rx="10"/>
  <text class="lbl" x="576" y="84">inside — hashidate</text>
  <rect class="chip" x="576" y="96"  width="344" height="36" rx="6"/>
  <text class="h" x="592" y="119">a face and a movement, named together</text>
  <rect class="chip" x="576" y="140" width="344" height="36" rx="6"/>
  <text class="h" x="592" y="163">lipsync, timed to the audio itself</text>
  <rect class="chip" x="576" y="184" width="344" height="36" rx="6"/>
  <text class="h" x="592" y="207">the camera, the set, the slides</text>
  <rect class="chip" x="576" y="228" width="344" height="36" rx="6"/>
  <text class="h" x="592" y="251">the character, drawn for OBS</text>

  <path class="ln" d="M400,175 L404,175"/>
  <path class="ln" d="M404,175 L408,175" marker-end="url(#a)"/>
  <rect class="card" x="412" y="130" width="136" height="90" rx="8"/>
  <text class="h" x="480" y="154" text-anchor="middle">one turn</text>
  <text class="mono" x="480" y="176" text-anchor="middle">text</text>
  <text class="mono" x="480" y="192" text-anchor="middle">perform</text>
  <text class="mono" x="480" y="208" text-anchor="middle">stage</text>
  <path class="ln" d="M548,175 L556,175" marker-end="url(#a)"/>

  <text class="s" x="480" y="318" text-anchor="middle">swap the model, the provider or the framework — nothing to the right of the line changes</text>
</svg>
