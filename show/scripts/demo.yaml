title: hashidate はこういうものです
note: |
  The one script that belongs to the project rather than to a broadcast: the
  runtime introducing itself, in about three and a half minutes.

  It is also a worked example. Every feature it talks about it also uses — the
  cue markup is demonstrated mid-sentence, the shot changes on the line that
  mentions shots, the acoustic changes on the line that mentions acoustics. A
  line that only described one of those would not tell you whether it worked.

  Nothing here names an avatar, a drawn expression or an overlay. Those are one
  model's data and a checkout has no model in it, so a demo that used them
  would be a demo that runs on one machine. The deck is the one thing it does
  name, and that one ships: `show/slides/hashidate.pdf`.

  yarn ctl play demo --check     read it without a server
  yarn ctl play demo --replace   drop what is pending and run it

# The state the script assumes, applied once before the first line. Spelled as
# commands because that is what they are; see src/script/index.ts.
setup:
  - cmd: reset
  # Off for the same reason any recorded script wants it off: the autopilot
  # holds a pose until something replaces it, the shot is framed while it runs,
  # and the take therefore opens on whatever it was holding. Breath, sway and
  # blink live in other layers and are unaffected.
  - cmd: idle
    on: false
  - cmd: look
    amount: 1
  # The opening set, up as soon as the script is loaded rather than on the first
  # line, so the shot can be framed against it while the queue is held.
  - cmd: backdrop
    id: dusk
  - cmd: camera
    frame: bust
  - cmd: room
    id: room

lines:
  - text: "[hello]こんばんは。今日は、わたしが動いている仕組みそのものの話をします。"

  - text: "[explain]この土台は hashidate といいます。ブラウザの中にわたしを描いて、外から一手ずつ指示を受け取る。やっていることはそれだけです。"
    reading: "この土台は、はしだてといいます。ブラウザの中にわたしをえがいて、外からいってずつ指示を受け取る。やっていることはそれだけです。"

  - text: "[wonder]それだけ、という顔をしましたね。"

  - text: "[agree]それだけなんです。何を喋るかは、ここでは決めません。"

  - text: "[explain]セリフを考えるのは外側にいる誰かの仕事で、わたしの側が引き受けるのは、そのセリフをどう言うか。"

  - text: "[notice]この線がはっきりしていることが、いちばん大事なところです。"

  # The emotion on a turn persists after it, unlike everything else on a line.
  # Left at joy here on purpose: it carries into the next two lines.
  - text: "[explain]受け取る単位は「ターン」と呼んでいます。喋る言葉と、そのときの顔と、体の動きが、ひとまとまりで届く。"
    emotion:
      neutral: 0.6
      joy: 0.3

  - text: "[bouncy]動きには名前がついていて、たとえば今のこれは「ごきげん」。"

  # The vocabulary showing its range, one performance per clause. Spaced a
  # clause apart so each is seen before the next one replaces it.
  - text: "[ponder]数えてみたら、八十を超えていました。[peace]ピースも、[heartHands]ハートも、[catPaw]猫の手もできます。"

  - text: "[shy]……全部やると日が暮れるので、このくらいにしておきます。"

  # Counting on the fingers, one per clause. Each number is given a few words of
  # its own so the hand has settled before the next one replaces it.
  - text: "[curious]指で数えることもできます。"

  - text: "[countOne]まず、ひとつ。[countTwo]それから、ふたつ。"

  - text: "[countThree]みっつ。[countFour]そして、よっつ。"

  # Close in for the face: the mid-sentence demonstration below reads better at
  # this distance, and the two lines after it talk about what is on screen.
  - text: "[interested]今度は、顔に寄ってみます。"
    stage:
      camera: face

  # The cue markup demonstrating itself. Three performances inside one sentence,
  # each starting where it is written — which is the only place a caller can put
  # one, since a second turn would break the clause in half.
  - text: "[explain]名前はセリフの途中にも書けます。[happy]ここで嬉しくなって、[gloomy]ここでしょんぼりして、[calm]また戻ってくる。全部ひとつのセリフです。"

  - text: "[blank]まばたきや目線の小さな揺れは、言われなくても勝手に動きます。"

  - text: "[explain]口の形は、セリフの音から母音を拾って作っています。"

  - text: "[shy]……ちょっと近すぎますね。戻ります。"
    stage:
      camera: bust

  # Under the hood, from the rigging side: what is actually true of the engine.
  # Gestures are directions in character space, arms are a constrained solve
  # every frame, hair is springs, nods follow phrase boundaries measured in the
  # audio, and the small variations are random — so no two takes match.
  - text: "[ponder]ここで少し、中の話を。わたしの動きは、モーションキャプチャを流しているのではなく、毎フレーム、その場で計算しています。"

  - text: "[explain]ジェスチャは関節の角度ではなく、手をどちらへ向けるかで書いてあるので、左右を入れ替えても、骨格の違うモデルでも、同じ動きになります。"

  - text: "[explain]腕は七つの自由度を、可動域に収まるように毎フレーム解いていて、[nope]手が顔にめり込む答えは、ちゃんと捨てています。"

  - text: "[explain]髪の揺れはばねの計算で、うなずきは文の切れ目に合わせて。[giggle]だから同じセリフでも、毎回すこしずつ違う動きになります。"

  - text: "[explain]絵と音の置き場所も、セリフに付けて渡せます。"

  # Said in the shot it is talking about. The camera and the backdrop move as
  # this line starts, so what is described and what is seen are the same frame.
  - text: "[spotlight]たとえば——引きの絵にして、外を夜にしました。"
    stage:
      camera: full
      backdrop: night

  - text: "[listening]声が響く場所も別に選べます。今いるのは、ホールということになっています。"
    stage:
      room: hall

  # Said while the hall is still on, so the claim is heard as it is made. Rooms
  # are impulse responses libsonare synthesises from a box, its absorption and
  # where speaker and listener stand; the voice chain and the BGM run on it too.
  - text: "[explain]この響きは、部屋の大きさと壁の吸音から、libsonare で計算しています。"
    reading: "この響きは、部屋の大きさと壁の吸音から、リブソナーレで計算しています。"

  - text: "[explain]声の音作りも同じ libsonare です。合成したままの素の声を、イコライザーやコンプレッサーで、配信向けに整えてから鳴らしています。BGM も同じ仕組みで流れています。"
    reading: "声の音作りも同じリブソナーレです。合成したままの素の声を、イコライザーやコンプレッサーで、配信向けに整えてから鳴らしています。ビージーエムも同じ仕組みで流れています。"

  - text: "[giggle]ちょっと大げさでしたね。戻します。"
    stage:
      camera: bust
      room: room

  # --- 資料 ---------------------------------------------------------------
  #
  # The deck goes up and the character steps aside on the *same line*. Sent as a
  # separate `place` command the layout lands at some other moment, and the
  # frame is briefly wrong in the most visible way there is — the character
  # standing in the middle of the page she is talking about.
  #
  # The deck is `show/slides/hashidate.pdf`, which ships with this repository.
  # Without it these lines still run: an id the renderer cannot open is reported
  # and the stream carries on, so what is lost is the picture, not the segment.
  - text: "[sparkle]資料を出すこともできます。PDF を置いておくと、後ろに映ります。"
    reading: "資料を出すこともできます。ピーディーエフを置いておくと、後ろに映ります。"
    stage:
      camera: upper
      deck: hashidate
      slide: 1
      place:
        # Measured against this deck rather than picked. Height sets her size;
        # the shift keeps her clear of slide 2's diagram as the box widens.
        # Slide 3 is the author's page and may be covered.
        avatar: { anchor: bottom-right, width: 0.32, height: 0.68, margin: 0.015, shift: 0.08 }

  - text: "[explain]さっきの境界の話も、こうして図にしておけます。"
    stage: { slide: 2 }

  - text: "[bashful]最後の一枚は、わたしを書いた人の紹介です。"
    stage: { slide: 3 }

  # Down and back to the middle in one line, for the same reason as going up.
  # The one-finger count on "one line" is the point of picking it.
  - text: "[countOne]下ろすのも、戻るのも、一行です。"
    reading: "下ろすのも、戻るのも、いちぎょうです。"
    stage:
      camera: bust
      deck: null
      place:
        avatar: { anchor: center, width: 1, height: 1, margin: 0, shift: 0 }

  - text: "[secret]それから、ここだけの話。"

  - text: "[explain]この仕組みは、ローカルホスト、つまりこの機械の中からしか届きません。"
    reading: "この仕組みは、ローカルホスト、つまりこの機械の中からしか届きません。"

  - text: "[calm]わたしの見た目も声も借りものだからです。[promise]外に出さないのは、遠慮ではなくて約束のほう。"
    emotion:
      relaxed: 0.7
      neutral: 0.3

  - text: "[explain]動きは自分で足せます。ファイルを一枚置くと、それがそのまま名前のついた動きになります。"

  - text: "[nice]今喋っているこれも、置いてある台本を一枚流しているだけ。"

  # `hold` keeps the face up after the line. Used once, at the end, where the
  # character is meant to still be standing there when the words stop.
  - text: "[happy]だいたい、そんなところです。"
    hold: true

  - text: "見てくれてありがとう。また。"
    perform: thanks

# Applied once the last line has been said, undoing the setup's idle switch so
# the character is left standing rather than frozen on the closing pose.
teardown:
  - cmd: idle
    on: true
