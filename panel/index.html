<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- What shows before React mounts, so it can only be one language. The
         panel sets it again from the catalogue once it knows the locale. -->
    <title>hashidate panel</title>
    <meta name="color-scheme" content="dark" />
    <!-- Inline rather than a file, so the tool ships no loose assets and the
         console stays free of a 404 nobody will ever chase. The panel's mark is
         the viewer's turned on its side: same two colours, told apart at a
         glance in a tab strip that will have both open all evening. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f1115'/%3E%3Crect x='4' y='4' width='8' height='2' fill='%237ad3e8'/%3E%3Crect x='4' y='7' width='8' height='2' fill='%237ad3e8' opacity='.55'/%3E%3Crect x='4' y='10' width='8' height='2' fill='%237ad3e8' opacity='.3'/%3E%3C/svg%3E"
    />
    <!-- Local-only tool: no analytics, no CDN, no outbound requests. Fonts are
         installed from npm and bundled, on the same rule the viewer follows. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
